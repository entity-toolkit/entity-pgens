[simulation]
  name    = "compton_emission"
  engine  = "srpic"
  runtime = 100.0

[grid]
  resolution = [64, 64]
  extent     = [[0.0, 1.0], [0.0, 1.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[radiation]
  [radiation.drag]
    [radiation.drag.compton]
      gamma_rad = 10.0

  [radiation.emission]
    [radiation.emission.compton]
      gamma_qed         = 50.0
      photon_energy_min = 0.001
      photon_weight     = 1.0
      photon_species    = 2

[algorithms]
  [algorithms.timestep]
    CFL = 0.5

  [algorithms.deposit]
    enable = false

  [algorithms.fieldsolver]
    enable = false

[particles]
  ppc0 = 1.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e3
    emission = "compton"

  [[particles.species]]
    label    = "ph"
    mass     = 0.0
    charge   = 0.0
    maxnpart = 1e3

[setup]
  sp1_positions = [[0.5, 0.5]]
  sp1_momenta   = [[10.0, 0.0, 0.0]]

[output]
  interval = 0.1

  [output.fields]
    enable = false

  [output.particles]
    enable = true
    stride = 1

  [output.spectra]
    enable   = true
    e_min    = 1e-4
    e_max    = 10.0
    log_bins = true
    n_bins   = 200

[diagnostics]
  colored_stdout = true
